name: RRG v0.1 Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrg-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate RRG v0.1
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.18,<5"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/validate_examples.py

      - name: Validate RRG v0.1 examples
        run: |
          python scripts/validate_examples.py

      - name: Validation completed
        if: success()
        run: |
          echo "RRG v0.1 validation passed."
          echo "Schema, semantic rules, and expected allocation decisions are consistent."
